<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">
    <main class="login-bg">
        <div class="login-frame">
            <div class="card login-card border-0">
                <div class="row g-0">
                    <div class="col-md-7 p-4 p-md-5">
                        {% include "flash.html" %}
                        <h1 class="h5 fw-bold mb-1">Se connecter</h1>
                        <p class="text-muted small mb-4">Connectez-vous pour continuer.</p>
                        <form action="" method="post">
                            <div class="mb-3">
                                <label class="form-label small text-muted" for="email">Email address</label>
                                <input class="form-control" type="email" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted" for="password">Password</label>
                                <input class="form-control" type="password" id="password" name="password" required>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3 small">
                                <a class="login-link" href="{{ url_for('auth.register') }}">create an account</a>
                                <a class="login-link" href="#">Forgot your password?</a>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Sign in</button>
                        </form>
                    </div>
                    <div class="col-md-5">
                        <div class="login-visual h-100" aria-hidden="true"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
